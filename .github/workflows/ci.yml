name: ci

# Push/PR test pipeline: the testing.md baseline gates plus the JS gates.
# MP_REQUIRE_NODE=1 turns "node missing" from a silent skip into a hard
# failure, so the node --check / node --test gates are actually enforced here.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: vet + tests (JS gates enforced)
        run: |
          go vet ./...
          MP_REQUIRE_NODE=1 go test ./... -count=1

      - name: race
        run: go test -race ./... -count=1

      - name: coverage gate
        run: scripts/cover.sh
