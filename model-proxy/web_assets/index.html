<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>model-proxy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/codemirror.min.css">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="live-dot" id="live-dot" aria-hidden="true"></span>
        <span class="brand-name">model-proxy</span>
        <span class="brand-meta" id="brand-meta" aria-live="polite">connecting…</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button data-tab="status"  class="tab active" role="tab" aria-selected="true">Status</button>
        <button data-tab="config"  class="tab"        role="tab" aria-selected="false">Config</button>
        <button data-tab="accounts" class="tab"       role="tab" aria-selected="false">Accounts</button>
        <button data-tab="analytics" class="tab"      role="tab" aria-selected="false">Analytics</button>
        <button data-tab="requests" class="tab"       role="tab" aria-selected="false">Requests</button>
        <button data-tab="live" class="tab"            role="tab" aria-selected="false">Live</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="tab-status"   class="tab-panel active" role="tabpanel" aria-label="Status"></section>
    <section id="tab-config"   class="tab-panel"        role="tabpanel" aria-label="Config"></section>
    <section id="tab-accounts" class="tab-panel"        role="tabpanel" aria-label="Accounts"></section>
    <section id="tab-analytics" class="tab-panel"       role="tabpanel" aria-label="Analytics"></section>
    <section id="tab-requests" class="tab-panel"        role="tabpanel" aria-label="Requests"></section>
    <section id="tab-live" class="tab-panel"            role="tabpanel" aria-label="Live"></section>
  </main>

  <dialog id="login-modal" aria-labelledby="login-title">
    <form method="dialog" id="login-form">
      <header class="modal-head">
        <h2 id="login-title">Sign in</h2>
        <button type="button" id="login-cancel" class="link-btn" aria-label="Close">Close</button>
      </header>
      <div id="login-body" class="modal-body" live-state="pending"></div>
    </form>
  </dialog>

  <dialog id="add-modal" aria-labelledby="add-title"></dialog>

  <!-- CodeMirror 5 (UMD globals) for the Raw YAML editor. Plain scripts, loaded
       before the deferred app.js module so window.CodeMirror is defined when the
       module runs. Vendored offline (no CDN) under web_assets/vendor/. -->
  <script src="vendor/codemirror.min.js"></script>
  <script src="vendor/yaml.min.js"></script>
  <script src="vendor/matchbrackets.min.js"></script>
  <script src="vendor/closebrackets.min.js"></script>
  <!-- uPlot (IIFE global) for the Analytics tab's trend charts. Same pattern:
       plain script, loaded before the deferred app.js module so the uPlot
       global is defined when the module runs. Vendored offline (no CDN). -->
  <script src="vendor/uPlot.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
