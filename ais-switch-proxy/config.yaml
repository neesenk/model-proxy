# ais-switch-proxy config — standalone from AIS Switch, portable to Linux.
# Paths support ~ expansion. env:ENV_VAR reads an environment variable.

listen: 127.0.0.1:15722
log_level: info            # debug | info | warn | error
# Runtime log + pid file. Default when unset: /tmp/ais-switch-proxy.log (pid: /tmp/ais-switch-proxy.pid).
# Uncomment to override:
# log_file: /var/log/ais-switch-proxy/ais-switch-proxy.log

# Gateway model-list cache + scheduled refresh (used by serve and the models command).
# Default cache file: next to sso_cookie_file (ais-switch-proxy-models.json).
# Default refresh interval: 1h. Uncomment to override:
# models_cache_file: ~/.ais-switch/ais-switch-proxy-models.json
# models_refresh_interval: 1h

auth:
  sso_cookie_file: ~/.ais-switch/google_oauth_auth.json
  cqp_mint_url: https://compass.llm.shopee.io/api/v1/cqp/ccswitch/api_key/get_or_generate
  codex_auth_file: ~/.ais-switch/codex_oauth_auth.json   # proxy's own codex OAuth tokens (via `codex-login`), NOT codex CLI's auth.json
  # static_key: "..."

routes:
  claude:
    path_prefixes: ["/v1/messages"]
    upstream: https://compass.llm.shopee.io/compass-api/v1
    upstream_path: ""
    auth: cqp
    model_map:
      claude-opus-4-7: glm-5.2
      claude-opus-4-8: glm-5.2
      opus: glm-5.2
      claude-sonnet-4-6: deepseek-v4-pro
      sonnet: deepseek-v4-pro
      claude-haiku-4-5: deepseek-v4-flash
  codex:
    path_prefixes: ["/v1/chat/completions", "/v1/responses"]
    # Default backend: chatgpt.com (codex OAuth). All codex-native models
    # (gpt-5.5, gpt-5.4, ...) go here automatically without enumerating each.
    upstream: https://chatgpt.com/backend-api/codex
    upstream_path: ""
    auth: codex_oauth
    # Gateway models (glm-5.2, deepseek-*) route to compass with CQP key.
    # Add gateway models here as they become available.
    model_routing:
      - models: [glm-5.2, deepseek-v4-pro, deepseek-v4-flash]
        upstream: https://compass.llm.shopee.io/compass-api/v1
        auth: cqp

takeover:
  # proxy_url defaults to http://<listen> when unset — leave it commented so
  # changing `listen` above is enough. Uncomment to override.
  # proxy_url: http://127.0.0.1:15721
  claude_file: ~/.claude/settings.json
  opencode_file: ~/.config/opencode/opencode.json
  codex_file: ~/.codex/config.toml
  pi_file: ~/.pi/agent/models.json
  # provider_id is the single identifier used by takeover for every agent that
  # takes one (opencode, pi, codex, future agents). claude doesn't use it.
  provider_id: ais-switch-proxy
  # pi_models: when unset, takeover writes the real gateway model IDs from the
  # models cache (glm-5.2 / deepseek-v4-pro / deepseek-v4-flash). Uncomment to
  # override with a custom list (e.g. aliases, if you also configure model_map).
  # pi_models: ["glm-5.2", "deepseek-v4-pro", "deepseek-v4-flash"]
  # Per-model output limits written into client configs (opencode limit.output,
  # pi maxTokens) and modalities. context_window comes from the gateway models
  # cache. Models not listed here fall back to defaults (output_tokens: 4096,
  # input/output: [text]). Edit per model as needed.
  model_limits:
    glm-5.2:
      output_tokens: 4096
      input: ["text"]
      output: ["text"]
    deepseek-v4-pro:
      output_tokens: 4096
      input: ["text"]
      output: ["text"]
    deepseek-v4-flash:
      output_tokens: 4096
      input: ["text"]
      output: ["text"]
