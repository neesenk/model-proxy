# model-proxy config — standalone, portable to Linux.
# Paths support ~ expansion. env:ENV_VAR reads an environment variable.

listen: 100.81.1.4:15722
log_level: info # debug | info | warn | error
# Runtime log + pid file. Default when unset: /tmp/model-proxy.log (pid: /tmp/model-proxy.pid).
# Set explicitly so every derivation agrees on ONE location: the daemon started by
# scripts/restart_serve.sh (`serve daemon --log-file serve.log`), bare `serve stop` /
# `serve status`, and the login/logout SIGHUP all resolve the pidfile as <log>.pid.
log_file: ~/model-proxy/serve.log
# Inbound request-body cap. Bodies are fully buffered for routing/conversion;
# anything larger is rejected with 413 before routing. Default 64 MiB:
# max_request_body_bytes: 67108864

# Upstream proxy. Resolution chain per request: providers.<name>.proxy_url ->
# this global setting -> HTTPS_PROXY/HTTP_PROXY env (+ NO_PROXY) -> OS system
# proxy -> direct. Value: http/https/socks5 URL (userinfo allowed), or `off`
# to force direct and stop the chain. Auto-detected sources (env NO_PROXY /
# system proxy) bypass loopback destinations; an explicitly configured proxy
# URL applies to loopback too (e.g. a local debugging proxy). The OS system
# proxy is detected once per process
# (restart after changing it); PAC/WPAD is not evaluated. A provider's
# proxy_url overrides this chain for BOTH its forwarded traffic AND its
# account-maintenance calls (usage/quota/mint/models); only the interactive
# `login` flows follow the global chain alone.
# proxy: http://127.0.0.1:7890
# 2026-10-10: compass.llm.shopee.io 只在此网络直连可达且更快更稳;mihomo 的 compass
# 链路是当日多波 unexpected EOF 的抖动源。全局 off = 所有出站(模型转发 + mint/quota
# 账号维护)直连、忽略系统代理。openrouter 直连可达性受影响时再把本行改回或按
# provider 配 proxy_url。
proxy: off
# Protocol conversion. strict_lossy (default false) refuses lossy-but-degradable
# request conversions: the converting target is skipped (capability-scanner
# semantics) and a route with no non-lossy target answers 400 instead of
# silently degrading content (e.g. dropping `stop` on anthropic→responses).
# Diagnostics for every attempt land in the request log's `diagnostics` field.
# conversion:
#   strict_lossy: false

# routes: AUTO-DERIVED. Every provider model is exposed under its model name
# (or its provider-level alias) and all providers serving the same name
# aggregate into one route, ordered by provider priority (lower first, then
# billing tier and quota surplus — see scheduling below). A pooled provider
# (multiple `login`s) fans a target out to its accounts, round-robin across
# conversations. Either protocol may reach any exposed model; the protocol
# (from the request path) selects the upstream path + base URL, and the wire
# probe picks the backend shape when a provider serves only one.
# Inspect the derived table: `model-proxy routes [model]` or the Web UI Config
# tab. An explicit `routes:` block is only needed for overrides — a fusion
# target, a declared protocol conversion, or a special ordering — and it
# replaces the derived route for that exposed name wholesale. Targets accept a
# compact "provider/model" string; the {provider, model, ...} map form is only
# needed when setting priority/protocol, e.g.:
# routes:
#   gpt-5.6: [{provider: codex, model: gpt-5.6, protocol: openai}]
# A route can also pick its scheduling STRATEGY (map form with strategy +
# targets): `strategy: quota` (the default, historical behavior) ranks targets
# by tier → priority → quota surplus and keeps session sticky;
# `strategy: load_balance` spreads load at SESSION granularity instead — each
# new session (client session id) takes the next available target
# round-robin and then parks on it (same sticky mechanics → prompt cache
# stays warm within a conversation); sessionless requests rotate per request.
# Availability gating is unchanged (circuit/rate-limit/quota-exhausted targets
# are skipped; pin / disabled-model overrides still apply), e.g.:
# routes:
#   glm-5.3:
#     strategy: load_balance
#     targets: [zhipu/glm-5.3, aqp/glm-5.3, volcengine/glm-5.3]
# claude-* aliases for anthropic clients are explicit routes too (the old
# anthropic-only claude_mapping was removed). NOTE: an alias route applies to
# EVERY protocol — claude-opus-4-8 / claude-haiku-4-5 are intentionally NOT
# aliased here so they keep resolving to the derived real-claude route; point
# the client at glm-5.3 / deepseek-v4-flash directly for the cheap backends.
# routes:
#  claude-opus-4-7: [zhipu/glm-5.3, aqp/glm-5.3, volcengine/glm-5.3, shopee/glm-5.3]
#  opus: [zhipu/glm-5.3, aqp/glm-5.3, volcengine/glm-5.3, shopee/glm-5.3]
#  claude-sonnet-4-6: [aqp/deepseek-v4-pro, volcengine/deepseek-v4-pro, shopee/deepseek-v4-pro, deepseek/deepseek-v4-pro]
#  sonnet: [aqp/deepseek-v4-pro, volcengine/deepseek-v4-pro, shopee/deepseek-v4-pro, deepseek/deepseek-v4-pro]
routes: {}
# deepseek-v4-pro: [aqp/deepseek-v4-pro, volcengine/deepseek-v4-pro, shopee/deepseek-v4-pro, deepseek/deepseek-flash]
# deepseek-v4-flash: [aqp/deepseek-v4-flash, volcengine/deepseek-v4-flash, shopee/deepseek-v4-flash, deepseek/deepseek-flash]

# route_policy: per-route tier policy (route 级档位策略) — declarative bands pick
# a preferred target (or, with grades, a preferred grade) from the request
# profile: estimated_tokens_min/max, follow_up (body already carries an assistant
# turn), has_tools, has_image (listed conditions AND together). Bands are
# evaluated in order; the FIRST match moves its target/grade to the FRONT of the
# scheduled order while every other target stays as failover — never a hard
# selection, and a band whose target/grade the route does not serve can never
# match (startup warns; see docs/architecture/request-routing.md).
# pin / x-mp-force-provider skip the policy entirely. A {provider: fusion, ...}
# target is allowed.
# route_policy:
#   glm-5.3:
#     # grades: split route targets into named groups. Each grade is filtered
#     # independently; the selected grade goes first and fallback controls the
#     # remaining grades. A target may belong to only ONE grade (config
#     # validation rejects cross-grade duplicates). Bands may use
#     # grade: <name> or a target resolving to a single grade.
#     # fallback: any (default) | next_grade | strict.
#     grades:
#       fast: [aqp/glm-5.3]
#       strong: [zhipu/glm-5.3]
#     fallback: any
#     bands:
#       - when: {follow_up: true, estimated_tokens_max: 8000}
#         grade: fast
#       - when: {estimated_tokens_min: 60000}
#         grade: strong
#     # escalation: session-level latch to a stronger target/grade after
#     # consecutive bad signals. BadSignals is the closed set
#     # {upstream_error, empty_ok, repeat_turn}; default is [upstream_error].
#     # Use grade: <name> for graded policies, target: otherwise.
#     escalation:
#       bad_signals: [upstream_error]
#       consecutive: 2
#       grade: strong
#       dwell: 30m
#     # selector: per-request decisions-model routing. shadow (default) records
#     # only; enforce moves the chosen target/grade to the front when confidence
#     # ≥ threshold. With grades candidates are grade-level (g0..gn); without
#     # grades they are target-level (c0..cn). Route-level selector must declare
#     # protocol: decisions and leaves direct_score_max / panel_top_k at 0.
#     selector:
#       target: {provider: typesafe, model: jev-1.13, protocol: decisions}
#       mode: shadow
#       confidence: 0.55
#       timeout: 800ms
#     # eval: L2 pairwise shadow evaluation for graded routes. The judge model
#     # must declare protocol: decisions. sample_rate is validated to [0, 0.5]
#     # (out-of-range is a config error); 0 or omitted falls back to the
#     # default 0.05. pair can be "opposite" (next grade in route target order)
#     # or "grade:<name>".
#     eval:
#       sample_rate: 0.05
#       pair: opposite
#       judge: {provider: typesafe, model: jev-1.13, protocol: decisions}
# Scheduling: every field has a code default (config.go accessors), so this
# block can be omitted entirely. Uncomment a line to override.
# scheduling:
#   circuit_threshold: 3 # (default 3) consecutive failover-eligible failures -> open circuit
#   circuit_cooldown: 10m # (default 10m) circuit open duration, then half-open (1 probe)
#   circuit_persist: 6s # (default 6s; "0" disables) failures must ALSO span at least this long before the circuit opens — external-network tolerance: one event killing N in-flight connections (proxy chain recycle, LB roll) must not read as N independent provider deaths; per-request failover is unaffected
#   rate_limit_backoff: 60s # (default 60s) transient 429 with no reset hint/Retry-After: skip this long, then probe
#   quota_cooldown: 1h # (default 1h) 429 classified quota-exhausted (balance/plan window) with no reset hint
#   model_lockout: 10m # (default 10m) model-level failure (404 / model-denied / empty 200): lock (provider,model)
#   retry_wait: 10s # (default 10s; "0" disables) all targets cooling down: wait ≤ this for the earliest expiry and retry (≤2×)
#   upstream_timeout: 1800s # (default 1800s) per-upstream-request timeout
#   stream_keepalive: 15s # (default 15s; "0" disables) SSE comment heartbeat into client streams after this much upstream silence
#   sticky_dwell: 1m # (default 1m) min time on the chosen provider before re-evaluating
#   quota_poll_interval: 5m # (default 5m) background quota poll cadence
#   quota_switch_margin: 15 # (default 15) switch provider if another's effective remaining beats current by >= this many pct points
#   quality_error_weight: 100 # (default 100 = 1.0) penalty per unit error-rate EWMA (2m half-life), subtracted from surplus; 0 disables
#   quality_ttft_weight: 20 # (default 20 = 0.2) penalty per unit normalized TTFT EWMA (10s reference); 0 disables
# Active override (defaults in the commented block above apply to the rest):
scheduling:
  sticky_dwell: 1m # idle sessions return to the preferred provider after 1m instead of 10m
# takeover: client targets come from templates now — embedded presets
# (`model-proxy takeover list`) or your own YAML in
# ~/.model-proxy/takeover-templates/<name>.yaml (same name overrides a preset;
# set file/provider_id/proxy_url there). The old takeover: block was removed.

# Per-request access log: writes the full request + response body of each
# committed upstream call as one JSONL line to a rotating file under dir, for
# offline analysis (prompt replay, failure debugging, agent behavior). Disabled
# by default (zero hot-path overhead). Restart the daemon after changing these
# (reload is not enough). While enabled, the daemon also tails the JSONL files
# into <dir>/index.db (SQLite: per-record metadata + token usage + line
# coordinates, metadata-sized compared to the logs) so the Web UI Requests /
# Sessions pages query the index instead of full-scanning the logs; the index
# is a derived view — deleting it just triggers a full rebuild on next start.
# Uncomment to enable:
request_log:
  enabled: true # default false
  dir: ~/.model-proxy/log/requests # default; explicit values must be absolute (~ expanded) — the daemon may start from any CWD
  max_file_size: 1073741824 # 1G per file (rotate on size or day)
  max_body_bytes: 5242880 # 5MB cap per body (truncates past it)
  retention: 720h # 30d; delete rotated files older than this; 0 = forever
  # MCP gateway exchanges (kind="mcp") go to their OWN stream instead of
  # polluting the LLM request log: mcp-YYYYMMDD.log files under mcp_dir
  # (default ~/.model-proxy/log/mcp), sharing the size/body/retention policy
  # above. The Requests page and /api/requests go back to LLM-only traffic;
  # /api/requests?kind=mcp reads the split stream. Restart-only. Default off.
  mcp_split: true
  # mcp_dir: ~/.model-proxy/log/mcp # default; same absolute-path rule as dir
  # Client session-id header allowlist (ordered; first non-empty wins). Drives
  # the request-log session_id and the live /api/events session_id. Default:
  # [x-claude-code-session-id, x-session-affinity, x-session-id, x-opencode-session]
  # Clients that send no session header (Codex, Kimi Code — agents implemented
  # strictly against the OpenAI/Anthropic specs) fall back to the spec-defined
  # BODY fields, in order: client_metadata.session_id (Codex Responses),
  # prompt_cache_key (OpenAI Chat/Responses; Kimi Code), metadata.user_id
  # (Anthropic Messages; Kimi Code) — the derived id feeds observation + guard
  # session blocks, never the routing sticky key.
  # session_headers: [x-claude-code-session-id, x-session-affinity]
# Web admin UI + JSON API (/ui/ + /api/). Enabled by default. Without the
# optional auth below, listen must stay loopback (enforced at startup);
# configuring both auth files allows a non-loopback listen.
web:
  auth:
    admin_token_file: ~/.model-proxy/admin_token
    api_keys_file: ~/.model-proxy/api_keys
# Call statistics (SQLite; per provider×model×minute buckets incl. latency/TTFT
# and per-agent dims; powers the `stats` CLI and Web UI Analytics/Requests
# pages). Defaults shown; omit the block to accept them.
stats:
  db_path: ~/.model-proxy/stats.db # default; explicit values must be absolute (~ expanded) — the daemon may start from any CWD
  retention: 0 # default 30d; 0 = keep forever
# Equivalent-cost analytics: token usage × OpenRouter price catalog (cached).
# pricing:
#   enabled: true                       # default; false disables catalog fetch (prices: overrides still work)
#   ttl: 24h                            # default catalog cache TTL
#   # source_url: https://openrouter.ai/api/v1/models  # default; MP_PRICING_URL env also works
# Per-model price overrides (USD per 1M tokens) for models the catalog misses:
# prices:
#   glm-5.2: {input: 0.60, output: 2.20, cache_read: 0.11}

# Monthly budget alerts on the equivalent USD cost of observed token usage
# (same pricing path as /api/analytics; unpriced models contribute nothing).
# Checked once per minute against the current local month's accumulated cost.
# On crossing: a "budget" live event (SSE /api/events) plus an optional
# webhook POST of {scope, month, threshold_usd, actual_usd} (2 retries;
# failures are only logged). Alerts fire once per (scope, month, threshold)
# per process — a restart may re-alert. Enabling this block requires a
# daemon restart (startup-only, like request_log); threshold value changes
# apply on reload.
# budgets:
#   monthly_usd: 20                       # global monthly total threshold; 0/unset = off
#   providers:                            # optional per-provider overrides
#     zhipu: 5                            # replaces the global threshold for the zhipu scope
#   webhook_url: https://hooks.example.com/budget  # optional; unset = live event only

# Counters survive reload/restart; reset clears history even while disabled.
# Exact response cache: SHA-256(method+path+body) byte-exact match replays the
# recorded response (x-mp-cache: hit). Disabled by default. Shields retries and
# duplicate single-shot requests; multi-turn chats change the body every turn,
# so the hit rate there is ≈ 0 (prefix savings belong to upstream prompt caching).
cache:
  enabled: false # default false
  ttl: 60m # default
  max_entries: 6000 # default
  max_body_bytes: 262144 # default 256KiB; larger responses not cached
# MCP gateway: expose remote MCP (Model Context Protocol) servers at
# /mcp/<name> on the daemon, so MCP clients (Claude Code .mcp.json, opencode,
# Codex, pi) point at the proxy instead of holding provider credentials.
# Provider-backed servers reuse that provider's credential pool (sessions pin
# to one account; a sessionless 401 rotates once); `auth: none` servers are
# anonymous public endpoints. Credentials are injected in memory only — never
# in config or logs. `mcp list` / `mcp test <name>` are the offline CLI.
# mcp:
#   zhipu-search:                      # client endpoint: POST http://127.0.0.1:PORT/mcp/zhipu-search
#     provider: zhipu                  # credential pool of this providers: entry
#     url: https://open.bigmodel.cn/api/mcp/web_search_prime/mcp
#     # transport: streamable          # streamable (default) | sse (legacy HTTP+SSE) | stdio (local child)
#     # timeout: 300s                  # per-POST upstream budget (default 300s)
#     # proxy_url: off                 # override the proxy chain for this server
#     # headers: {X-Api-Key: env:TAVILY_API_KEY}   # static headers, env:VAR indirection ONLY
#     # enabled: false                 # keep config but answer 404
#     # command: and env: are stdio-only; they are rejected at validation for streamable/sse
#   zhipu-search-legacy:               # legacy SSE form of the same upstream
#     provider: zhipu
#     url: https://open.bigmodel.cn/api/mcp/web_search_prime/sse
#     transport: sse
#   zhipu-vision:                      # stdio: one local child process per client session
#     transport: stdio
#     provider: zhipu                  # ${account.api_key} resolves from this pool
#     command: [npx, -y, "@z_ai/mcp-server"]
#     env: {Z_AI_API_KEY: "${account.api_key}", Z_AI_MODE: ZHIPU}
#     # env values: ${account.api_key} (pool key), env:VAR (daemon env), or a
#     # literal — literals on credential-shaped names (…_KEY/TOKEN/SECRET/…) are rejected
#   ark-datapro:                       # custom auth header: the RAW key goes
#     provider: volcengine             # under auth_header instead of Bearer
#     url: https://datapro.hqd.cn-beijing.volces.com/mcp
#     auth_header: X-Agent-Plan-Key    # apikey providers only (not aqp/codex)
#   exa:
#     url: https://mcp.exa.ai/mcp
#     auth: none                       # anonymous public endpoint
# Aggregated routes: one canonical tool surface over several mcp: servers
# (same /mcp/<name> namespace). tools/call fails over the targets in order
# (transport/401/404/429/5xx only — JSON-RPC business errors return as-is),
# sticky per session; tools/list exposes only the canonical names.
# Takeover projection: routes are the canonical client entries — member
# servers aggregated here are pruned from takeover writes by default
# (template mcp.include_routed_members: true restores the full list).
# mcp_routes:
#   web-search:                        # client endpoint: POST /mcp/web-search
#     targets:
#       - {mcp: zhipu-search, tools: {web_search: web_search_prime}}
#       - {mcp: exa,          tools: {web_search: web_search_exa}}

# ---- active MCP surface (tool names verified via `mcp test` 2026-09-17) ----
# jina intentionally omitted: mcp.jina.ai unreachable from this host today
# (curl EOF on all paths; re-add when it recovers).
mcp:
  stepfun-search: {provider: step-plan, url: 'https://api.stepfun.com/step_plan/v1/mcp/web_search/mcp'} # StepSearch: web_search ¥0.04/call (Step Plan Credit), web_fetch free
  zhipu-search: {provider: zhipu, url: 'https://open.bigmodel.cn/api/mcp/web_search_prime/mcp'}
  zhipu-reader: {provider: zhipu, url: 'https://open.bigmodel.cn/api/mcp/web_reader/mcp'}
  zhipu-zread: {provider: zhipu, url: 'https://open.bigmodel.cn/api/mcp/zread/mcp'}
  # ark-datapro: {provider: volcengine, url: 'https://datapro.hqd.cn-beijing.volces.com/mcp', auth_header: X-Agent-Plan-Key}
  exa: {url: 'https://mcp.exa.ai/mcp', auth: none}
  firecrawl: {url: 'https://mcp.firecrawl.dev/v2/mcp', auth: none}
  context7: {url: 'https://mcp.context7.com/mcp', auth: none}
  deepwiki: {url: 'https://mcp.deepwiki.com/mcp', auth: none}
  grep-app: {url: 'https://mcp.grep.app', auth: none}
  kimi-data: # Kimi Code managed plugin kimi-datasource (plugin-kimi-datasource:data):
    transport: stdio # local node child; self-loads the Kimi Code login token from
    command: [node, /Users/neesenk/.kimi-code/plugins/managed/kimi-datasource/bin/kimi-datasource.mjs] # $KIMI_CODE_HOME/credentials (falls back to ~/.kimi-code),
    # so no provider:/env: injection here — anonymous stdio like a credential-free backend
  vision: # generic name: any vision-capable backend can land here
    transport: stdio
    provider: zhipu
    command: [npx, -y, "@z_ai/mcp-server"]
    env: {Z_AI_API_KEY: "${account.api_key}", Z_AI_MODE: ZHIPU} # literals OK for benign keys; credential-shaped names (…_KEY/TOKEN/…)
    # still require indirection
  deepseek-search: # DeepSeek Web Search/Fetch API as a bundled MCP child — the deployed
    transport: stdio # binary serves it itself (`mcp-server deepseek-search`, CLI.md §13c);
    provider: deepseek # ¥0.005/call per successful search/fetch, account-level 5 QPS each
    command: [/Users/neesenk/model-proxy/model-proxy, mcp-server, deepseek-search] # needs a binary built with the subcommand
    env: {DEEPSEEK_API_KEY: "${account.api_key}"} # key injected from this pool; schema violations fail pre-egress (unbilled)
mcp_routes:
  # Web research: search (five engines by scenario — parameter shapes differ,
  # so they are NOT one failover set), read+clean (zhipu reader, firecrawl
  # scrape, stepfun web_fetch and deepseek url_fetch share the url parameter
  # and DO fail over; deepseek is the billed last leg), batch clean fetch,
  # and document parsing.
  # Datasource: professional data queries. kimi-data (Kimi Code kimi-datasource
  # plugin — Wind/S&P/EDGAR, macro, CN gov/corporate/academic/legal) is the
  # desc-then-call meta surface; dataset_search (volcengine dataPro) covers
  # stock/finance/corporate-risk/auto in one direct call. NOT one failover set —
  # different shapes; split out of web-research.
  datasource:
    targets:
      - {mcp: kimi-data, tools: {apidoc: get_data_source_desc, # step 1: fetch one source's API doc
          api_call: call_data_source_tool},} # step 2: structured api_name+params call per that doc
      #- {mcp: ark-datapro, tools: {ask: dataPro_search}} # fast path: one-shot natural-language question, no doc step
  web-research:
    targets:
      - {mcp: zhipu-search, tools: {web_search: web_search_prime}} # general/cn-optimized search (search_query)
      - {mcp: exa, tools: {web_search_semantic: web_search_exa, # semantic search (query+objective, required both)
          url_fetch_batch: web_fetch_exa}} # batch clean text (urls[])
      - {mcp: firecrawl, tools: {web_search_domain: firecrawl_search, # filtered search (domains/categories/tbs)
          url_read: firecrawl_scrape, # failover leg for url_read
          url_read_deep: firecrawl_scrape, # full scrape: formats/pdf/screenshot/json extraction
          doc_parse: firecrawl_parse}} # file parse/clean (PDF/HTML -> markdown/json)
      - {mcp: zhipu-reader, tools: {url_read: webReader}} # fast markdown read (url) — schema baseline for url_read
      - {mcp: stepfun-search, tools: {web_search_category: web_search, # category-filtered search: query+category programming|research|gov|business (+use_common_search fallback toggle); ¥0.04/call as Step Plan Credit)
          url_read: web_fetch}} # free clean fetch (url) — extra url_read failover leg
      - {mcp: deepseek-search, tools: {web_search_deepseek: web_search, # DeepSeek general search (query+count+need_content; rerank-scored, CN+global)
          # own canonical — the web_search failover set keeps zhipu's search_query shape
          url_read: url_fetch}} # billed last-resort read leg (url param, same shape as the free legs)
  code-search:
    targets:
      - {mcp: grep-app, tools: {code_search: searchGitHub}}
      - {mcp: zhipu-zread, tools: {repo_doc_search: search_doc, repo_read_file: read_file, repo_tree: get_repo_structure}}
      - {mcp: deepwiki, tools: {wiki_qa: ask_question, wiki_contents: read_wiki_contents, wiki_structure: read_wiki_structure}}
      - {mcp: context7, tools: {lib_resolve: resolve-library-id, lib_docs: query-docs}}
# Outbound secret guard (DLP-lite): scans the raw request body for
# high-confidence secret patterns (PEM private-key headers, AWS/OpenAI/
# Anthropic/GitHub/Google tokens) BEFORE forwarding upstream — coding agents
# paste local files into prompts, and a leaked key should not leave the
# machine. Request bodies only, never responses; one scan per request, shared
# by cache/fusion/shadow. Hits are reported by pattern type name only (live
# event + stats counter) — matched content is never logged.
# guard:
#   secrets: log      # log (default: allow + live event + counter) | redact
#                     # (forward with matches replaced by [REDACTED]) | block
#                     # (reject with 400) | off (no scan)
#                     # These actions apply to PATTERN hits only — exact
#                     # matches on this proxy's own credentials are always
#                     # recorded + rejected + session-blocked (see
#                     # adjudicate below).
#   known_secrets: true   # default true; also match the proxy's own credentials
#   decode: true          # default true; catch base64/hex-encoded forms
#   mcp_secrets: off      # outbound secret scan on MCP gateway request bodies
#                         # (tools/call arguments): log | redact | block | off
#                         # (default off — unlike the LLM-path secrets default)
#   paths: log            # log (default) | block | off — sensitive-path signal;
#                         # redact intentionally unsupported (rewriting a path
#                         # would corrupt legitimate coding work)
#   audit: true           # default true; persist security events to the audit log
#   session_scan: true    # default true; detect a known credential split into
#                         # fragments across requests of one session
#                         # (x-claude-code-session-id; bounded in-memory windows,
#                         # reported as known_secret_fragmented — under secrets=redact
#                         # a fragmented hit degrades to log: a cross-request secret
#                         # cannot be rewritten)
#   audit_path: ""        # optional absolute path; default ~/.model-proxy/log/security/security.log
#   extra_patterns:       # user secret formats (gitleaks extend-style)
#     - {name: myvendor_key, regex: '\bmv-[A-Za-z0-9]{32,}', literal: 'mv-'}
#                         # name: ^[a-z0-9_]{1,32}$; literal (optional) must be a
#                         # guaranteed substring of every regex match (pre-filter)
#   extra_paths:          # user sensitive paths, literal body match (~ kept literal)
#     - ~/.company/secrets
#   adjudicate:           # AI second opinion for pattern hits (default off).
#                         # When on, rule-table/custom secret hits and strong
#                         # path hits are NOT recorded immediately: the matched
#                         # span plus masked context is sent (async, cached by
#                         # content hash) to the designated model, which returns
#                         # a THREE-level verdict: high (real leak: audit record
#                         # + session block), medium (risk-shaped but
#                         # unconfirmable: audit record only), low (benign
#                         # fixture/doc/example: ignored — full JSONL trail
#                         # only, never in the queryable store). The model also
#                         # returns its judgment logic and the factual basis it
#                         # cited (scrubbed + length-capped before storage).
#                         # Queue overflow, the per-request cap (4 jobs),
#                         # same-content dedup across rules, model errors and
#                         # timeouts fail OPEN to the classic immediate record
#                         # (verdict error/skipped). With the channel on even
#                         # secrets=block defers pattern hits to the LLM.
#                         # Enabling opts in to sending the matched snippet to
#                         # the designated model.
#                         # REPEAT INTERCEPTION: secret-kind hits judged
#                         # high are remembered (sha256-only index,
#                         # guard_blocked.json — never the bytes) and any
#                         # later request carrying the same bytes is
#                         # rejected outright (400 + session block, no
#                         # second judge call), exactly like known-secret
#                         # exact matches. Path hits are never indexed.
#                         # UNBLOCK IS THE FINAL RISK CALL: unblocking a
#                         # session cascades — the verdict's content joins
#                         # the operator override table (guard_allowed.json)
#                         # and those bytes are never re-intercepted or
#                         # re-judged. Auditable/revocable: `guard allowed`
#                         # / `guard disallow <hash>`.
#                         # The judge call goes through the shared scheduling
#                         # seam: same ordering + cooldown skip + pin as
#                         # forward traffic, per-attempt budget slices (a
#                         # hanging provider burns only its own share), and
#                         # its successes/failures/429s feed the shared
#                         # circuit breaker. Usage counters (calls/tokens)
#                         # persist in guard_stats.json across restarts.
#                         # Exact-match hits (this proxy's own credentials,
#                         # known_secret*/fragmented) are always intercepted:
#                         # record + reject + session block until explicit
#                         # unblock — no config action softens them.
#     enabled: false
#     model: ""           # required when enabled: exposed route name of the
#                         # judging model; its provider needs anthropic_base_url
#     block_session: true # high verdict blocks the session (persists across
#                         # restarts) until 'model-proxy guard unblock' or the
#                         # WebUI Security page clears it
#     timeout: 20s        # per-call budget
#     workers: 2          # worker count (1..8; restart to change)
#     max_queue: 256      # pending bound; overflow fails open
#     context_bytes: 256  # context each side of the hit sent for judgment
#     cache_max: 4096     # persisted verdict cache size (~/.model-proxy/
#                         # guard_verdicts.json, hash keys only)

# Opt-in explicit enable (the field default above is off): enabling means the
# matched snippet plus masked context is sent to this model for judgment.
guard:
  adjudicate:
    enabled: false
    model: glm-5.3-flash # judging model (derived route; zhipu/volcengine/
    # shopee/aqp all carry anthropic_base_url)
    block_session: false

# Shadow evaluation: after the primary response commits, re-send the same request
# to a shadow backend, record-only — never affects the client, circuit breakers,
# stats or sticky routing. Compare with `model-proxy shadow report` or the Web
# UI (GET /api/shadow-report).
# shadow_sample_rate: 1.0               # global sample rate (default 1.0; 0 disables all)
# shadow_max_concurrent: 4              # global in-flight cap (default 4; excess dropped)
# shadow:
#   glm-5.2: {provider: deepseek, model: deepseek-v4-pro}                # shadow one route…
#   deepseek-v4-pro: {provider: codex, model: gpt-5.5, protocol: openai} # …cross-protocol OK
# Explicit anthropic requires anthropic_base_url; openai/responses require
# openai_base_url. Invalid endpoint/protocol combinations fail config loading.

# Multi-model orchestration (fusion): a route target {provider: fusion, model:
# <workflow>} fans the request out to the panel members in parallel (candidate
# answers), then the synthesizer model merges the candidates into the final
# (streamed) answer. Cost = N+1 upstream calls per request, latency ≈ candidate
# wait + synthesis first-token — use for hard-question routes only, never as a
# default route.
# fusion:
#   hard-coding:                        # workflow name (the route target's model field)
#     panel:                            # 2-4 candidate generators, called in parallel
#       - {provider: zhipu, model: glm-5.2}
#       - {provider: volcengine, model: deepseek-v4-pro}
#       - {provider: codex, model: gpt-5.5, protocol: openai}  # per-member protocol → auto-convert
#     synthesizer: {provider: zhipu, model: glm-5.2}  # merge model — use your strongest
#     min_panel: 2                      # default 2; fewer candidates → original request
#                                       # goes straight to the synthesizer (graceful degrade)
#     max_runs_per_day: 50              # optional: daily orchestration cap; over → degrade
#                                       # to a direct synthesizer call (degraded runs don't
#                                       # consume the budget)
#     first_turn_only: true             # optional: only orchestrate single-turn requests
#                                       # (no assistant message in the body)
#     judge: {provider: zhipu, model: glm-5.2}  # optional: pre-synthesis review pass
#                                       # (consensus/conflicts/omissions) injected into the
#                                       # synthesis prompt; judge failure never fails the run
#     # instruction: "..."              # optional: override the built-in synthesis
#                                       # instruction template (≤ 4000 chars)
#     # selector:                       # optional: decisions-model (e.g. TypeSafe Jev)
#     #   target: {provider: typesafe, model: jev-1.13, protocol: decisions}
#     #   mode: shadow                  # shadow (default, record only) | enforce (act on
#     #                               # confidence ≥ threshold): direct_score_max > 0 answers
#     #   confidence: 0.55              # easy requests directly via the chosen model
#     #   direct_score_max: 0           # (selector_direct, no budget consumed); panel_top_k
#     #   panel_top_k: 0                # trims the panel by decision probability (never
#     #   timeout: 800ms                # below quorum). Any failure → static full panel.
#     # panel members may carry rubric: "one-line description" to steer the choice.
# Observe: GET /api/fusion?workflow=<name> (per-workflow aggregates + recent runs);
# stats --provider fusion (requests = orchestrations, failovers = degrades).
# routes:
#   hard-question:
#     - {provider: fusion, model: hard-coding, priority: 1}
