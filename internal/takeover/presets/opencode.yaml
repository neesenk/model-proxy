description: opencode — @ai-sdk/anthropic provider(自拼 /messages,base_url 带 /v1)+ 全量暴露模型
file: ~/.config/opencode/opencode.json
format: json
base_url: v1
json:
  set:
    provider.{{provider_id}}:
      name: "{{display_name}}"
      npm: "@ai-sdk/anthropic"
      options:
        apiKey: "{{token}}"
        baseURL: "{{base_url}}"
  drift_path: provider.{{provider_id}}.options.baseURL
models:
  shape: opencode
  json_path: provider.{{provider_id}}.models
