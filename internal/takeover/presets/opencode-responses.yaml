description: opencode — @ai-sdk/openai provider(/v1/responses)+ 全量暴露模型
file: ~/.config/opencode/opencode.json
format: json
client: opencode
protocol: responses
base_url: v1
provider_id: model-proxy-responses
json:
  set:
    provider.{{provider_id}}:
      name: "{{display_name}} (responses)"
      npm: "@ai-sdk/openai"
      options:
        apiKey: "{{token}}"
        baseURL: "{{base_url}}"
  drift_path: provider.{{provider_id}}.options.baseURL
models:
  shape: opencode
  json_path: provider.{{provider_id}}.models
mcp:
  json_path: mcp
  json_entry:
    type: remote
    url: "{{mcp.url}}"
    enabled: true
