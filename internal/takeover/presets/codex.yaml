description: codex — config.toml 注入 [model_providers] 段(wire_api=responses)并置顶层 model_provider
file: ~/.codex/config.toml
format: toml
client: codex
protocol: responses
base_url: v1
models:
  shape: codex
  catalog_file: ~/.codex/model-proxy-models.json
toml:
  top_keys:
    model_provider: '"{{provider_id}}"'
  sections:
    - name: 'model_providers."{{provider_id}}"'
      body: |
        name = "{{display_name}}"
        base_url = "{{base_url}}"
        wire_api = "responses"
        requires_openai_auth = true
mcp:
  toml_section: 'mcp_servers."{{mcp.name}}"'
  toml_body: |
    url = "{{mcp.url}}"
