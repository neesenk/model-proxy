description: opencode — @ai-sdk/openai provider(OpenAI Chat Completions,base_url 带 /v1)+ 全量暴露模型
file: ~/.config/opencode/opencode.json
format: json
base_url: v1
provider_id: model-proxy-openai
json:
  set:
    provider.{{provider_id}}:
      name: "{{display_name}} (openai)"
      npm: "@ai-sdk/openai"
      options:
        apiKey: "{{token}}"
        baseURL: "{{base_url}}"
  drift_path: provider.{{provider_id}}.options.baseURL
models:
  shape: opencode
  json_path: provider.{{provider_id}}.models
