description: opencode — @ai-sdk/openai-compatible provider(OpenAI Chat Completions,base_url 带 /v1)+ 全量暴露模型
file: ~/.config/opencode/opencode.json
format: json
client: opencode
protocol: openai
base_url: v1
provider_id: model-proxy-openai
json:
  set:
    provider.{{provider_id}}:
      name: "{{display_name}} (openai-compatible)"
      npm: "@ai-sdk/openai-compatible"
      options:
        apiKey: "{{token}}"
        baseURL: "{{base_url}}"
  drift_path: provider.{{provider_id}}.options.baseURL
models:
  shape: opencode
  json_path: provider.{{provider_id}}.models
mcp:
  json_path: mcp
  json_entry:
    type: remote
    url: "{{mcp.url}}"
    enabled: true
