description: kimi(Kimi Code CLI)— config.toml 注入 openai provider + 每模型 models 段 + ~/.kimi-code/mcp.json 接管网关 MCP 面
file: ~/.kimi-code/config.toml
format: toml
client: kimi
protocol: openai
base_url: v1
toml:
  sections:
    - name: 'providers."{{provider_id}}"'
      body: |
        type = "openai"
        base_url = "{{base_url}}"
        api_key = "{{token}}"
mcp:
  file: ~/.kimi-code/mcp.json
  json_path: mcpServers
  json_entry:
    url: "{{mcp.url}}"
models:
  shape: kimi
  toml_section: 'models."{{model.id}}"'
  toml_body: |
    provider = "{{provider_id}}"
    model = "{{model.id}}"
    max_context_size = {{model.context}}
    capabilities = {{model.capabilities}}
    {{model.efforts}}
  also_remove: 'models.{{model.id}}'
