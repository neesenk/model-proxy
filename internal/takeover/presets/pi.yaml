description: pi — models.json provider 条目 + 全量暴露模型 + mcp.json 接管网关 MCP 面（pi MCP 扩展读取）；协议变体（anthropic/openai/responses）见 variants
file: ~/.pi/agent/models.json
format: json
client: pi
mcp:
  file: ~/.pi/agent/mcp.json
  json_path: mcpServers
  json_entry:
    type: http
    url: "{{mcp.url}}"
variants:
  - name: pi
    protocol: anthropic
    base_url: bare
    json:
      set:
        providers.{{provider_id}}:
          baseUrl: "{{base_url}}"
          api: "anthropic-messages"
          apiKey: "{{token}}"
      drift_path: providers.{{provider_id}}.baseUrl
    models:
      shape: pi
      json_path: providers.{{provider_id}}.models
  - name: pi-openai
    protocol: openai
    base_url: v1
    provider_id: model-proxy-openai
    json:
      set:
        providers.{{provider_id}}:
          baseUrl: "{{base_url}}"
          api: "openai-completions"
          apiKey: "{{token}}"
      drift_path: providers.{{provider_id}}.baseUrl
    models:
      shape: pi
      json_path: providers.{{provider_id}}.models
  - name: pi-responses
    protocol: responses
    base_url: v1
    provider_id: model-proxy-responses
    json:
      set:
        providers.{{provider_id}}:
          baseUrl: "{{base_url}}"
          api: "openai-responses"
          apiKey: "{{token}}"
      drift_path: providers.{{provider_id}}.baseUrl
    models:
      shape: pi
      json_path: providers.{{provider_id}}.models
