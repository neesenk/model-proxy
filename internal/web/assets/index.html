<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <title>model-proxy</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/codemirror.min.css">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="live-dot" id="live-dot" aria-hidden="true"></span>
        <span class="brand-name">model-proxy</span>
        <span class="brand-meta" id="brand-meta" aria-live="polite">connecting…</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button data-tab="status"  class="tab active" role="tab" aria-selected="true">Status</button>
        <button data-tab="config"  class="tab"        role="tab" aria-selected="false">Config</button>
        <button data-tab="accounts" class="tab"       role="tab" aria-selected="false">Accounts</button>
        <button data-tab="takeover" class="tab"       role="tab" aria-selected="false">Takeover</button>
        <button data-tab="mcp" class="tab"            role="tab" aria-selected="false">MCP</button>
        <button data-tab="eval" class="tab"           role="tab" aria-selected="false">Eval</button>
        <button data-tab="analytics" class="tab"      role="tab" aria-selected="false">Analytics</button>
        <button data-tab="requests" class="tab"       role="tab" aria-selected="false">Requests</button>
        <button data-tab="security" class="tab"       role="tab" aria-selected="false">Security</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="tab-status"   class="tab-panel active" role="tabpanel" aria-label="Status"></section>
    <section id="tab-config"   class="tab-panel"        role="tabpanel" aria-label="Config"></section>
    <section id="tab-accounts" class="tab-panel"        role="tabpanel" aria-label="Accounts"></section>
    <section id="tab-takeover" class="tab-panel"       role="tabpanel" aria-label="Takeover"></section>
    <section id="tab-analytics" class="tab-panel"       role="tabpanel" aria-label="Analytics"></section>
    <section id="tab-requests" class="tab-panel"        role="tabpanel" aria-label="Requests"></section>
    <section id="tab-mcp" class="tab-panel"             role="tabpanel" aria-label="MCP"></section>
    <section id="tab-eval" class="tab-panel"            role="tabpanel" aria-label="Eval"></section>
    <section id="tab-security" class="tab-panel"        role="tabpanel" aria-label="Security"></section>
  </main>

  <dialog id="login-modal" aria-labelledby="login-title">
    <form method="dialog" id="login-form">
      <header class="modal-head">
        <h2 id="login-title">Sign in</h2>
        <button type="button" id="login-cancel" class="link-btn" aria-label="Close">Close</button>
      </header>
      <div id="login-body" class="modal-body" live-state="pending"></div>
    </form>
  </dialog>

  <dialog id="add-modal" aria-labelledby="add-title"></dialog>

  <dialog id="tk-modal" class="tk-wide" aria-labelledby="tk-title"></dialog>
  <dialog id="tk-run-modal" class="tk-wide tk-fixed" aria-labelledby="tkr-title"></dialog>

  <dialog id="confirm-modal" aria-labelledby="confirm-title"></dialog>

  <dialog id="admin-auth-modal" aria-labelledby="admin-auth-title">
    <form id="admin-auth-form">
      <header class="modal-head">
        <h2 id="admin-auth-title">Admin authentication</h2>
      </header>
      <div class="modal-body">
        <p>This proxy requires an admin token before runtime data can be shown.</p>
        <div class="field">
          <label for="admin-auth-token">Admin token</label>
          <input id="admin-auth-token" name="token" type="password"
                 autocomplete="current-password" spellcheck="false" required>
          <span class="hint">The token is exchanged for an HttpOnly browser-session cookie and is not stored by JavaScript.</span>
        </div>
        <div id="admin-auth-msg" class="msg" role="status" aria-live="polite"></div>
        <div class="modal-actions">
          <button id="admin-auth-submit" class="btn primary" type="submit">Unlock</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- CodeMirror 5 (UMD globals) for the Raw YAML editor and uPlot (IIFE
       global) for the trend charts. Vendored offline (no CDN). Plain
       scripts load before the deferred app.js module so the globals exist
       when it runs. -->
  <script src="vendor/codemirror.min.js"></script>
  <script src="vendor/yaml.min.js"></script>
  <script src="vendor/matchbrackets.min.js"></script>
  <script src="vendor/closebrackets.min.js"></script>
  <script src="vendor/uPlot.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
